<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <!-- Main background gradient — matches Logo.jsx exactly -->
    <linearGradient id="bg" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#7c7ffd"/>
      <stop offset="100%" stop-color="#4740e8"/>
    </linearGradient>

    <!-- Subtle inner shine for depth -->
    <linearGradient id="shine" x1="0%" y1="0%" x2="60%" y2="100%">
      <stop offset="0%"   stop-color="#ffffff" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-8%" y="-8%" width="124%" height="132%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5"
        flood-color="#2e27b0" flood-opacity="0.45"/>
    </filter>

    <!-- Pill glow -->
    <filter id="pillGlow" x="-20%" y="-40%" width="140%" height="180%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="1.2" result="blur"/>
      <feFlood flood-color="#ffffff" flood-opacity="0.25" result="color"/>
      <feComposite in="color" in2="blur" operator="in" result="glow"/>
      <feMerge>
        <feMergeNode in="glow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- ── Background rounded square ─────────────────────────── -->
  <rect width="64" height="64" rx="15" ry="15"
    fill="url(#bg)" filter="url(#shadow)"/>

  <!-- ── Shine overlay ──────────────────────────────────────── -->
  <rect width="64" height="64" rx="15" ry="15"
    fill="url(#shine)"/>

  <!-- ── Top pill (wider, left-aligned) ────────────────────── -->
  <!-- Mirrors Logo.jsx: x=8,y=9,w=17,h=8,rx=4 scaled to 64px space -->
  <rect x="12" y="14" width="27" height="13" rx="6.5"
    fill="white" fill-opacity="0.95"
    filter="url(#pillGlow)"/>

  <!-- ── Bottom pill (wider, right-aligned) ────────────────── -->
  <!-- Mirrors Logo.jsx: x=15,y=23,w=17,h=8,rx=4 scaled to 64px space -->
  <rect x="24" y="36" width="27" height="13" rx="6.5"
    fill="white" fill-opacity="0.95"
    filter="url(#pillGlow)"/>

  <!-- ── Accent dot — bottom-right of lower pill ───────────── -->
  <!-- Mirrors Logo.jsx: cx=27,cy=27,r=2.5 (the indigo dot) -->
  <circle cx="46" cy="42.5" r="4"
    fill="#5b5ff5"/>

  <!-- ── Subtle top-left gloss ─────────────────────────────── -->
  <ellipse cx="22" cy="18" rx="14" ry="7"
    fill="white" fill-opacity="0.07"
    transform="rotate(-12 22 18)"/>
</svg>
