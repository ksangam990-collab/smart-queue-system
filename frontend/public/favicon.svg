<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <!-- 3D background cube gradient -->
    <linearGradient id="bgTop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7c7ffd"/>
      <stop offset="100%" stop-color="#5b5ff5"/>
    </linearGradient>
    <linearGradient id="bgLeft" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b32cc"/>
      <stop offset="100%" stop-color="#4740e8"/>
    </linearGradient>
    <linearGradient id="bgRight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4740e8"/>
      <stop offset="100%" stop-color="#5b5ff5"/>
    </linearGradient>

    <!-- Lightning bolt gradient -->
    <linearGradient id="boltGrad" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%"   stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="50%"  stop-color="#c9ccff" stop-opacity="1"/>
      <stop offset="100%" stop-color="#0fb894" stop-opacity="1"/>
    </linearGradient>

    <!-- Glow filter -->
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="1.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <!-- Outer glow on bolt -->
    <filter id="boltGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2" result="blur"/>
      <feFlood flood-color="#a4a8ff" flood-opacity="0.7" result="color"/>
      <feComposite in="color" in2="blur" operator="in" result="glow"/>
      <feMerge><feMergeNode in="glow"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <!-- Drop shadow -->
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#1e1b4b" flood-opacity="0.4"/>
    </filter>

    <!-- Rounded rect clip -->
    <clipPath id="roundClip">
      <rect x="2" y="2" width="60" height="60" rx="14" ry="14"/>
    </clipPath>
  </defs>

  <!-- ── Outer rounded square with shadow ──────────────────── -->
  <rect x="2" y="2" width="60" height="60" rx="14" ry="14" fill="url(#bgTop)" filter="url(#shadow)"/>

  <!-- ── 3D cube face — top ─────────────────────────────────── -->
  <!-- Lighter top face gives 3D illusion -->
  <polygon points="32,6 58,18 32,30 6,18" fill="url(#bgTop)" clip-path="url(#roundClip)"/>

  <!-- ── 3D cube face — left ───────────────────────────────── -->
  <polygon points="6,18 32,30 32,58 6,46" fill="url(#bgLeft)" clip-path="url(#roundClip)"/>

  <!-- ── 3D cube face — right ──────────────────────────────── -->
  <polygon points="58,18 32,30 32,58 58,46" fill="url(#bgRight)" clip-path="url(#roundClip)"/>

  <!-- ── Edge lines for 3D depth ───────────────────────────── -->
  <g clip-path="url(#roundClip)" opacity="0.25">
    <line x1="32" y1="30" x2="32" y2="58" stroke="#ffffff" stroke-width="0.5"/>
    <line x1="6"  y1="18" x2="32" y2="30" stroke="#ffffff" stroke-width="0.5"/>
    <line x1="58" y1="18" x2="32" y2="30" stroke="#ffffff" stroke-width="0.5"/>
  </g>

  <!-- ── Accent glow orb top-right ─────────────────────────── -->
  <circle cx="50" cy="14" r="6" fill="#0fb894" opacity="0.25" filter="url(#glow)" clip-path="url(#roundClip)"/>
  <circle cx="50" cy="14" r="3" fill="#0fb894" opacity="0.5" clip-path="url(#roundClip)"/>

  <!-- ── Lightning bolt — centered ─────────────────────────── -->
  <g filter="url(#boltGlow)">
    <path
      d="M36 10 L22 33 L30 33 L28 54 L42 31 L34 31 Z"
      fill="url(#boltGrad)"
      stroke="rgba(255,255,255,0.3)"
      stroke-width="0.5"
      stroke-linejoin="round"
    />
  </g>

  <!-- ── Shine highlight top-left ──────────────────────────── -->
  <ellipse cx="18" cy="16" rx="10" ry="5"
    fill="white" opacity="0.08"
    transform="rotate(-20 18 16)"
    clip-path="url(#roundClip)"/>
</svg>
